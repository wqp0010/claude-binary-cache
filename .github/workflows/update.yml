name: Update Claude Binary

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get latest version
        id: version
        run: |
          VERSION=$(curl -s https://downloads.claude.ai/claude-code-releases/latest)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download manifest
        run: |
          curl -L \
            -o manifest.json \
            https://downloads.claude.ai/claude-code-releases/${{ steps.version.outputs.version }}/manifest.json

          cat manifest.json

      - name: Download macOS arm64 binary
        run: |
          curl -L \
            -o claude-darwin-arm64 \
            https://downloads.claude.ai/claude-code-releases/${{ steps.version.outputs.version }}/darwin-arm64/claude

          chmod +x claude-darwin-arm64

      - name: Download Windows binary
        run: |
          WINDOWS_PATH=$(jq -r '.platforms | to_entries[] | select(.key | contains("windows")) | .key' manifest.json | head -n 1)

          echo "Windows platform: $WINDOWS_PATH"

          curl -L \
            -o claude-windows.exe \
            https://downloads.claude.ai/claude-code-releases/${{ steps.version.outputs.version }}/${WINDOWS_PATH}/claude.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: |
            claude-darwin-arm64
            claude-windows.exe
